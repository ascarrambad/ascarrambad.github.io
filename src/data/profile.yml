about:
  - >-
      When I was a child, I became fascinated by computers thanks to the
      countless hours spent watching my dad playing videogames. Since
      elementary school I tried to learn some BASIC using what I could find in
      my local library, but it was really during middle school that I was able
      to take some afternoon extra classes in the computer lab, where I
      "developed" some toy programs in Visual Basic 6.
  - >-
      After a taxing period in high school I enrolled at PoliMI, but soon after
      that I figured out I would not become an engineer. During that time I
      created a tech blog with a friend of mine called "Something Divine". We
      also kept a podcast, accordingly named "Divinecast"; you can still look
      it up. More importantly, I learned how to develop for iOS platforms by
      myself, and the iOS app for the blog and podcast was my first creation.
      Seeing it recognised by Apple meant a lot to me.
  - >-
      During my BSc studies I freelanced for a brief time as an iOS developer
      thanks to the accumulated knowledge of developing seven iOS apps. At the
      beginning of my MSc studies I got accepted for a joint program at USI,
      where I focused on Deep Learning and managed to publish at ICASSP the
      work produced for my thesis. After graduation, and after a perfectly
      timed pandemic, I joined IDSIA first as a researcher and then as a PhD
      student.
  - >-
      Daft Punk are my favorite artist. I also quite enjoy many other genres,
      from jazz to country, though unfortunately I never cared enough to
      remember many artists' names and song titles.
  - >-
      Back to the Future, Toy Story, and The Matrix are the movies I grew up
      watching; Birdman, Drive, Frank, La grande bellezza, Monty Python's The
      Meaning of Life, The Big Lebowsky, The Nice Guys, Lady Bird, and La La
      Land are some of the movies I love.
  - >-
      Growing up I had to attend some mandatory sport, which I accordingly
      disliked. The only one I enjoyed playing is field archery, in which I
      participated as a young athlete at the Italian national cup. Nowadays I
      try to maintain a rhythm of one hour per day of free-body exercises such
      as yoga, pilates, power stretch, and core stability, as they work wonders
      for my poor aching back.

